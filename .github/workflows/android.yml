name: Build Shadowfront Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Unity-Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Unity-Library-Android-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: auto
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: BuildScript.BuildAndroidAPK
          buildsPath: Builds

      - name: Verify APK was generated
        shell: bash
        run: |
          set -euo pipefail

          APK_COUNT=$(find Builds -type f -name '*.apk' | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "::error::Android build completed without generating an APK. Expected an APK under Builds/."
            exit 1
          fi

          echo "Generated APK(s):"
          find Builds -type f -name '*.apk' -print

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Shadowfront-debug-apk
          path: Builds/**/*.apk
          if-no-files-found: error
          retention-days: 14
